<rect width="1400" height="800" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="24" font-weight="700" fill="#0b1b2e" text-anchor="start">Power tree: one 7.4 V pack for everything</text>
<text x="40.0" y="72.0" font-size="13.5" font-weight="400" fill="#5a6b80" text-anchor="start">Sources: mentorpi/WIRING.md (path), 3d/bluewave_body/wl/research/electronics_wl.md (loads). Loads marked EST are datasheet values, not measured on this car.</text>
