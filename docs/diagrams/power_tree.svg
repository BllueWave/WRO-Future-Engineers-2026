<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="512" viewBox="0 0 1000 512" role="img" aria-labelledby="t d">
  <title id="t">Power tree of the Blue Wave car</title>
  <desc id="d">Battery side: a 2S LiPo, 7.4 V nominal and 8.4 V at full charge, goes through the main power switch to the Cytron MD13S, which drives the brushed DC motor. Logic side: the Arduino Uno R3 5 V rail feeds the Pixy2 through the ICSP header. Estimated current at 5 V: Uno logic about 50 mA, Pixy2 about 140 mA, each HC-SR04 about 15 mA while pinging, about 235 mA in total. Motor current never returns through the Uno header.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 20px; font-weight: 600; }
    .h2 { font-size: 15px; font-weight: 600; fill: #0969da; }
    .name { font-size: 15px; font-weight: 600; }
    .name14 { font-size: 14px; font-weight: 600; }
    .body { font-size: 13px; fill: #1f2328; }
    .sub { font-size: 13px; fill: #57606a; }
    .small { font-size: 12px; fill: #57606a; }
    .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.5; }
    .pwr { stroke: #1f2328; stroke-width: 2.5; fill: none; }
    .hp { fill: #1f2328; }
  </style>

  <rect x="1" y="1" width="998" height="510" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text class="title" x="32" y="42">Power tree</text>
  <text class="sub" x="32" y="64">The battery drives the motor at 7.4 V. The Uno 5 V rail feeds the Pixy2 camera.</text>

  <!-- Battery side -->
  <text class="h2" x="32" y="104">Battery side, 7.4 V</text>

  <rect class="box" x="32" y="120" width="192" height="84" rx="6"/>
  <text class="name" x="48" y="146">2S LiPo</text>
  <text class="body" x="48" y="166">7.4 V nominal</text>
  <text class="small" x="48" y="186">8.4 V at full charge</text>

  <line class="pwr" x1="224" y1="162" x2="270" y2="162"/>
  <polygon class="hp" points="280,162 270,157 270,167"/>

  <rect class="box" x="280" y="120" width="192" height="84" rx="6"/>
  <text class="name14" x="296" y="146">Main power switch</text>
  <text class="body" x="296" y="166">switches the car on</text>
  <text class="small" x="296" y="186">one switch, rule 9.10</text>

  <line class="pwr" x1="472" y1="162" x2="518" y2="162"/>
  <polygon class="hp" points="528,162 518,157 518,167"/>

  <rect class="box" x="528" y="120" width="192" height="84" rx="6"/>
  <text class="name" x="544" y="146">Cytron MD13S</text>
  <text class="body" x="544" y="166">7.4 V motor supply</text>
  <text class="small" x="544" y="186">PWM D3, DIR D8</text>

  <line class="pwr" x1="720" y1="162" x2="766" y2="162"/>
  <polygon class="hp" points="776,162 766,157 766,167"/>

  <rect class="box" x="776" y="120" width="192" height="84" rx="6"/>
  <text class="name" x="792" y="146">Drive motor</text>
  <text class="body" x="792" y="166">brushed DC</text>
  <text class="small" x="792" y="186">race speed PWM 30</text>

  <!-- Logic side -->
  <text class="h2" x="32" y="240">Logic side, 5 V</text>

  <rect class="box" x="32" y="280" width="220" height="96" rx="6" style="stroke:#0969da;stroke-width:2"/>
  <text class="name" x="48" y="306">Arduino Uno R3</text>
  <text class="body" x="48" y="328">5 V rail</text>
  <text class="small" x="48" y="350">ICSP pin 2 = 5 V, pin 6 = GND</text>

  <line class="pwr" x1="252" y1="328" x2="302" y2="328"/>
  <polygon class="hp" points="312,328 302,323 302,333"/>

  <rect class="box" x="312" y="280" width="230" height="96" rx="6"/>
  <text class="name" x="328" y="306">Pixy2 camera</text>
  <text class="body" x="328" y="328">5 V and GND from ICSP</text>
  <text class="small" x="328" y="350">SPI on the same header</text>

  <!-- Current estimate table -->
  <rect x="600" y="252" width="368" height="152" rx="6" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
  <text class="name14" x="616" y="277">Estimated current at 5 V</text>
  <line x1="616" y1="289" x2="952" y2="289" stroke="#d0d7de" stroke-width="1"/>
  <text class="body" x="616" y="312">Arduino Uno logic</text>
  <text class="body" x="952" y="312" text-anchor="end">about 50 mA</text>
  <text class="body" x="616" y="336">Pixy2</text>
  <text class="body" x="952" y="336" text-anchor="end">about 140 mA</text>
  <text class="body" x="616" y="360">3 × HC-SR04, while pinging</text>
  <text class="body" x="952" y="360" text-anchor="end">about 15 mA each</text>
  <line x1="616" y1="371" x2="952" y2="371" stroke="#d0d7de" stroke-width="1"/>
  <text class="name14" x="616" y="393">Total</text>
  <text class="name14" x="952" y="393" text-anchor="end">about 235 mA</text>

  <!-- Ground rule -->
  <line x1="32" y1="436" x2="968" y2="436" stroke="#d0d7de" stroke-width="1"/>
  <text class="body" x="32" y="464"><tspan style="font-weight:600">Ground rule:</tspan> motor current never returns through the Uno header. Only signal ground goes to the Uno.</text>
  <text class="sub" x="32" y="488">We keep this rule since a black lead connected near the Uno power header caused heat and a burnt component.</text>
</svg>
