<polyline points="175.0,380.0 175.0,300.0" fill="none" stroke="#6b7a8f" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a6b7a8f)" stroke-linejoin="round"/>
<text x="185.0" y="352.0" font-size="12" font-weight="600" fill="#6b7a8f" text-anchor="start" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">charge lead</text>
<text x="40.0" y="660.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">Estimated draw (datasheets): about 1.5–2.2 A typical, 4–5 A peak; about 55–75 min on the 2200 mAh pack. Not measured on this car.</text>
<text x="40.0" y="684.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">Practice rule (mat runbook): no timed run below 7.4 V. obs_v17 holds the drive at its 7.0 V behaviour whatever the pack voltage (battery hold).</text>
<text x="40.0" y="708.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">The Pi 5 is fed from the RRC Lite's 5 V 5 A USB-C output; a 3 A cable cuts the Pi's USB ports to 0.6 A, so the PD cable is part of the build.</text>
</svg>
