<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="770" viewBox="0 0 1000 770" role="img" aria-labelledby="t d">
  <title id="t">Sensor layout of the Blue Wave car, top view</title>
  <desc id="d">Top view of the 200 by 125 mm car, nose to the right. The front HC-SR04 sits on the nose and faces straight ahead. The left and right HC-SR04s sit on the slanted front corners and face about 40 degrees from the nose axis. Each sonar beam is drawn at about 15 degrees half-angle. The Pixy2 camera faces forward and is drawn on the centre line with its 60 degree horizontal field of view.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .title { font-size: 20px; font-weight: 600; }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 13px; fill: #57606a; }
    .dim { font-size: 14px; fill: #1f2328; }
    .ang { font-size: 13px; font-weight: 600; fill: #0969da; }
    .cone { fill: #0969da; fill-opacity: 0.12; stroke: #0969da; stroke-width: 1.5; }
    .axis { stroke: #0969da; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
    .fov { stroke: #1f2328; stroke-width: 1.6; stroke-dasharray: 9 6; fill: none; }
    .thin { stroke: #57606a; stroke-width: 1.2; fill: none; }
    .arc { stroke: #0969da; stroke-width: 1.5; fill: none; }
    .can { fill: #ffffff; stroke: #1f2328; stroke-width: 1.5; }
    .ink { fill: #1f2328; }
    .grey { fill: #57606a; }
  </style>

  <rect x="1" y="1" width="998" height="768" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <text class="title" x="32" y="42">Sensor layout, top view</text>
  <text class="sub" x="32" y="64">Nose to the right. The car's left side is at the top of the drawing.</text>

  <!-- Sonar beams (drawn first, under the body) -->
  <path class="cone" d="M460,360 L614.55,318.59 A160,160 0 0,1 614.55,401.41 Z"/>
  <path class="cone" d="M435,290 L580.01,222.38 A160,160 0 0,0 526.77,158.94 Z"/>
  <path class="cone" d="M435,430 L580.01,497.62 A160,160 0 0,1 526.77,561.06 Z"/>
  <line class="axis" x1="474" y1="360" x2="630" y2="360"/>
  <line class="axis" x1="446" y1="280.8" x2="569.06" y2="177.51"/>
  <line class="axis" x1="446" y1="439.2" x2="569.06" y2="542.49"/>

  <!-- Pixy2 horizontal field of view -->
  <line class="fov" x1="515.26" y1="305" x2="853.01" y2="110"/>
  <line class="fov" x1="515.26" y1="415" x2="853.01" y2="610"/>
  <path class="thin" d="M749.09,170 A380,380 0 0,1 749.09,550"/>
  <text class="ang" x="812" y="356" style="font-size:15px">60°</text>
  <text class="sub" x="812" y="376">Pixy2 horizontal</text>
  <text class="sub" x="812" y="394">field of view</text>

  <!-- Body outline, 200 x 125 mm at 1.6 px per mm -->
  <path d="M140,260 H410 L460,320 V400 L410,460 H140 Z" fill="#f6f8fa" stroke="#1f2328" stroke-width="2"/>
  <line class="thin" x1="170" y1="292" x2="240" y2="292"/>
  <polygon class="grey" points="250,292 240,287 240,297"/>
  <text class="sub" x="170" y="284">forward</text>

  <!-- Pixy2, facing forward -->
  <rect x="400" y="343" width="22" height="34" rx="3" fill="#ffffff" stroke="#1f2328" stroke-width="1.5"/>
  <rect x="422" y="354" width="6" height="12" fill="#1f2328"/>
  <text class="name" x="392" y="365" text-anchor="end">Pixy2</text>
  <line x1="430.39" y1="354" x2="445.98" y2="345" stroke="#1f2328" stroke-width="1.6"/>
  <line x1="430.39" y1="366" x2="445.98" y2="375" stroke="#1f2328" stroke-width="1.6"/>

  <!-- HC-SR04 units: board edge plus two transducers -->
  <g transform="translate(460 360)">
    <rect x="-3" y="-36" width="3" height="72" class="ink"/>
    <rect class="can" x="0" y="-33.6" width="14" height="25.6" rx="2"/>
    <rect class="can" x="0" y="8" width="14" height="25.6" rx="2"/>
  </g>
  <g transform="translate(435 290) rotate(-40)">
    <rect x="-3" y="-36" width="3" height="72" class="ink"/>
    <rect class="can" x="0" y="-33.6" width="14" height="25.6" rx="2"/>
    <rect class="can" x="0" y="8" width="14" height="25.6" rx="2"/>
  </g>
  <g transform="translate(435 430) rotate(40)">
    <rect x="-3" y="-36" width="3" height="72" class="ink"/>
    <rect class="can" x="0" y="-33.6" width="14" height="25.6" rx="2"/>
    <rect class="can" x="0" y="8" width="14" height="25.6" rx="2"/>
  </g>

  <!-- Angle annotations -->
  <line class="thin" x1="455" y1="290" x2="515" y2="290"/>
  <path class="arc" d="M495,290 A60,60 0 0,0 480.96,251.43"/>
  <text class="ang" x="500" y="276">≈40°</text>

  <line class="thin" x1="455" y1="430" x2="515" y2="430"/>
  <path class="arc" d="M495,430 A60,60 0 0,1 480.96,468.57"/>
  <text class="ang" x="500" y="455">≈40°</text>

  <path class="arc" d="M575,360 A115,115 0 0,1 571.08,389.76"/>
  <text class="ang" x="580" y="412">15°</text>

  <!-- Sensor labels -->
  <text class="name" x="560" y="136">HC-SR04 left</text>
  <text class="sub" x="560" y="154">≈40° from nose axis</text>
  <text class="name" x="640" y="354">HC-SR04 front</text>
  <text class="sub" x="640" y="372">on the nose, 0°</text>
  <text class="name" x="560" y="576">HC-SR04 right</text>
  <text class="sub" x="560" y="594">≈40° from nose axis</text>

  <!-- Width dimension -->
  <line class="thin" x1="136" y1="260" x2="84" y2="260"/>
  <line class="thin" x1="136" y1="460" x2="84" y2="460"/>
  <line class="thin" x1="96" y1="270" x2="96" y2="450"/>
  <polygon class="grey" points="96,261 92,271 100,271"/>
  <polygon class="grey" points="96,459 92,449 100,449"/>
  <text class="dim" x="82" y="360" text-anchor="middle" transform="rotate(-90 82 360)">125 mm</text>

  <!-- Length dimension -->
  <line class="thin" x1="140" y1="468" x2="140" y2="532"/>
  <line class="thin" x1="460" y1="490" x2="460" y2="532"/>
  <line class="thin" x1="150" y1="520" x2="450" y2="520"/>
  <polygon class="grey" points="141,520 151,516 151,524"/>
  <polygon class="grey" points="459,520 449,516 449,524"/>
  <text class="dim" x="300" y="544" text-anchor="middle">200 mm</text>

  <!-- Legend -->
  <line x1="32" y1="636" x2="968" y2="636" stroke="#d0d7de" stroke-width="1"/>
  <rect class="cone" x="32" y="655" width="28" height="14"/>
  <text class="sub" x="72" y="667">HC-SR04 beam, about 15° half-angle, cut short to fit the page. The code reads up to 400 cm.</text>
  <line class="fov" x1="32" y1="690" x2="60" y2="690"/>
  <text class="sub" x="72" y="695">Pixy2 horizontal field of view, 60° (datasheet).</text>
  <text class="sub" x="32" y="725">Outline to scale at 200 × 125 mm (team figure, 14 Sep 2026). The corner shape and the camera mark are schematic.</text>
  <text class="sub" x="32" y="747">Sonar angles from our drawing of the nose, 14 Sep 2026: left drawn at 39°, right at 41°.</text>
</svg>
