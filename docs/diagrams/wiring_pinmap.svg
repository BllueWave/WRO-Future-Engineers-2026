<polyline points="450.0,572.0 596.0,550.0" fill="none" stroke="#6b7a8f" stroke-width="2.2" stroke-linejoin="round"/>
<rect x="900" y="470" width="330" height="150" rx="8" fill="#fff3e6" stroke="#d9730d" stroke-width="1.6"/>
<path d="M900,500 v-22 a8,8 0 0 1 8,-8 h314 a8,8 0 0 1 8,8 v22 z" fill="#d9730d"/>
<text x="912.0" y="490.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Cytron MD13S (Grove input)</text>
<text x="912.0" y="520.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">PWM  ← GPIO12, pin 32, 490 Hz</text>
<text x="912.0" y="539.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">GND  ← pin 34 (signal ground only)</text>
<text x="912.0" y="558.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">DIR  ← GPIO16, pin 36, low = forward</text>
<text x="912.0" y="577.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">V+ / V− from the pack; motor A / B</text>
<polyline points="681.0,580.0 836.0,580.0 836.0,516.0 900.0,516.0" fill="none" stroke="#d9730d" stroke-width="2.2" marker-end="url(#ad9730d)" stroke-linejoin="round"/>
<polyline points="681.0,610.0 848.0,610.0 848.0,535.0 900.0,535.0" fill="none" stroke="#0b1b2e" stroke-width="2.2" stroke-linejoin="round"/>
<polyline points="681.0,640.0 860.0,640.0 860.0,554.0 900.0,554.0" fill="none" stroke="#d9730d" stroke-width="2.2" marker-end="url(#ad9730d)" stroke-linejoin="round"/>
<text x="760.0" y="573.0" font-size="12" font-weight="600" fill="#d9730d" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">PWM (pin 32)</text>
<text x="760.0" y="603.0" font-size="12" font-weight="600" fill="#0b1b2e" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">GND (pin 34)</text>
<text x="760.0" y="633.0" font-size="12" font-weight="600" fill="#d9730d" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4" stroke-linejoin="round">DIR (pin 36)</text>
<rect x="900" y="126" width="440" height="196" rx="8" fill="#eaf2fc" stroke="#1560bd" stroke-width="1.6"/>
<path d="M900,156 v-22 a8,8 0 0 1 8,-8 h424 a8,8 0 0 1 8,8 v22 z" fill="#1560bd"/>
<text x="912.0" y="146.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Pi 5 USB and power ports</text>
<text x="912.0" y="176.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">USB-A 1, lower  →  LD19 lidar (CH340 adapter, 230400 baud)</text>
<text x="912.0" y="195.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">USB-A 1, upper  →  HP60C RGB-D camera</text>
<text x="912.0" y="214.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">USB-A 2, upper  →  RRC Lite “USB serial” port, 1 Mbaud</text>
<text x="912.0" y="233.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">USB-C power      ←  RRC Lite “5V5A” port, 5 V 5 A PD cable</text>
<text x="912.0" y="252.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">a 3 A cable limits the Pi's USB ports to 0.6 A</text>
<rect x="900" y="340" width="440" height="112" rx="8" fill="#fff3e6" stroke="#d9730d" stroke-width="1.6"/>
<path d="M900,370 v-22 a8,8 0 0 1 8,-8 h424 a8,8 0 0 1 8,8 v22 z" fill="#d9730d"/>
<text x="912.0" y="360.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">RRC Lite servo port 3 → steering servo</text>
<text x="912.0" y="390.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">S / + / −, servo jumper at 5 V</text>
<text x="912.0" y="409.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">centre 1441 µs, 22.4 µs/deg, limits 853–2194 µs</text>
<text x="40.0" y="770.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">Drive safety in code: PWM low brakes on stop; 200 ms watchdog; a guardian zeroes PWM if the program dies; motor cut after 0.8 s stall;</text>
<text x="40.0" y="792.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">every stop sets PWM to 0, then DIR low. Motor current returns on the MD13S V− power wire, not on the Grove ground.</text>
<text x="40.0" y="822.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">Hardware PWM on GPIO12 returned EINVAL on the Pi 5, so the drive uses software PWM through lgpio (profile: hw_pwm 0, dir_forward_high false, mat 2026-09-30).</text>
</svg>
