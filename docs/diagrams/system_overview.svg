<rect width="1400" height="900" fill="#ffffff"/>
<text x="40.0" y="46.0" font-size="24" font-weight="700" fill="#0b1b2e" text-anchor="start">System overview: BW-2 (WLtoys 1:28 chassis + Raspberry Pi 5)</text>
<text x="40.0" y="72.0" font-size="13.5" font-weight="400" fill="#5a6b80" text-anchor="start">What runs where and how the parts talk. Sources: mentorpi/bluewave/*.py, mentorpi/profiles/wltoys_bw2.json, mentorpi/WIRING.md, run logs of 2026-10-01.</text>
<text x="1360.0" y="882.0" font-size="12" font-weight="600" fill="#5a6b80" text-anchor="end">BLUE WAVE · WRO Future Engineers 2026</text>
<text x="40.0" y="112.0" font-size="12" font-weight="700" fill="#5a6b80" text-anchor="start">SENSORS AND INPUT</text>
<text x="420.0" y="112.0" font-size="12" font-weight="700" fill="#5a6b80" text-anchor="start">COMPUTE</text>
<text x="1090.0" y="112.0" font-size="12" font-weight="700" fill="#5a6b80" text-anchor="start">ACTUATORS AND DRIVE</text>
<rect x="40" y="126" width="300" height="128" rx="8" fill="#e7f6fd" stroke="#1b8fc4" stroke-width="1.6"/>
<path d="M40,156 v-22 a8,8 0 0 1 8,-8 h284 a8,8 0 0 1 8,8 v22 z" fill="#1b8fc4"/>
<text x="52.0" y="146.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">LD19 lidar</text>
<text x="52.0" y="176.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">360° scan, 10 Hz (598–599 rpm), 1° bins</text>
<text x="52.0" y="195.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">scan plane 50 mm above the mat</text>
<text x="52.0" y="214.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">USB via CH340, 230400 baud</text>
<rect x="40" y="274" width="300" height="128" rx="8" fill="#e7f6fd" stroke="#1b8fc4" stroke-width="1.6"/>
<path d="M40,304 v-22 a8,8 0 0 1 8,-8 h284 a8,8 0 0 1 8,8 v22 z" fill="#1b8fc4"/>
<text x="52.0" y="294.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">HP60C RGB-D camera</text>
<text x="52.0" y="324.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">RGB 640 × 480 at 14 fps</text>
<text x="52.0" y="343.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">pitch 19.6° measured on the mat</text>
<text x="52.0" y="362.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">USB; depth not used for ranging</text>
<rect x="40" y="422" width="300" height="104" rx="8" fill="#e7f6fd" stroke="#1b8fc4" stroke-width="1.6"/>
<path d="M40,452 v-22 a8,8 0 0 1 8,-8 h284 a8,8 0 0 1 8,8 v22 z" fill="#1b8fc4"/>
<text x="52.0" y="442.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">START button</text>
<text x="52.0" y="472.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">12 mm push button</text>
<text x="52.0" y="491.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">GPIO17 (pin 11), internal pull-up</text>
<rect x="420" y="126" width="550" height="420" rx="8" fill="#eaf2fc" stroke="#1560bd" stroke-width="1.6"/>
<path d="M420,156 v-22 a8,8 0 0 1 8,-8 h534 a8,8 0 0 1 8,8 v22 z" fill="#1560bd"/>
<text x="432.0" y="146.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Raspberry Pi 5 (Active Cooler)</text>
<rect x="436" y="166" width="518" height="254" rx="8" fill="#ffffff" stroke="#7fa7d9" stroke-width="1.6"/>
<text x="448.0" y="188.0" font-size="14" font-weight="700" fill="#1560bd" text-anchor="start">bluewave agent (Python, own process)</text>
<text x="450.0" y="216.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">lidar.py</text>
<text x="450.0" y="231.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">LD19 driver</text>
<text x="708.0" y="216.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">lidar_perc.py</text>
<text x="708.0" y="231.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">walls, signs, lot from one scan</text>
<text x="450.0" y="249.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">loc.py + ICP</text>
<text x="450.0" y="264.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">pose fitted to the field walls</text>
<text x="708.0" y="249.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">speed.py</text>
<text x="708.0" y="264.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">speed without an encoder</text>
<text x="450.0" y="282.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">camera.py, vision.py</text>
<text x="450.0" y="297.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">frames and colour masks</text>
<text x="708.0" y="282.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">seats.py</text>
<text x="708.0" y="297.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">24 legal sign seats</text>
<text x="450.0" y="315.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">programs/</text>
<text x="450.0" y="330.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">obs_v17.py, BEST_OPEN_14s.py</text>
<text x="708.0" y="315.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">park.py</text>
<text x="708.0" y="330.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">parallel-park legs</text>
<text x="450.0" y="348.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">shield.py</text>
<text x="450.0" y="363.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">lidar check of every drive command</text>
<text x="708.0" y="348.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">motor.py</text>
<text x="708.0" y="363.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">MD13S PWM / DIR, guardian</text>
<text x="450.0" y="381.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">rrc.py</text>
<text x="450.0" y="396.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">RRC Lite serial link</text>
<text x="708.0" y="381.0" font-size="12.5" font-weight="700" fill="#1560bd" text-anchor="start">blackbox.py</text>
<text x="708.0" y="396.0" font-size="11.5" font-weight="400" fill="#0b1b2e" text-anchor="start">50 Hz IMU into the run file</text>
<rect x="436" y="432" width="254" height="100" rx="8" fill="#ffffff" stroke="#7fa7d9" stroke-width="1.6"/>
<text x="448.0" y="454.0" font-size="13.5" font-weight="700" fill="#1560bd" text-anchor="start">Docker: MentorPi (ROS 2)</text>
<text x="448.0" y="476.0" font-size="12" font-weight="400" fill="#0b1b2e" text-anchor="start">HP60C vendor driver</text>
<text x="448.0" y="494.0" font-size="12" font-weight="400" fill="#0b1b2e" text-anchor="start">RGB stream to the agent</text>
<rect x="700" y="432" width="254" height="100" rx="8" fill="#ffffff" stroke="#7fa7d9" stroke-width="1.6"/>
<text x="712.0" y="454.0" font-size="13.5" font-weight="700" fill="#1560bd" text-anchor="start">race/race_main.py</text>
<text x="712.0" y="476.0" font-size="12" font-weight="400" fill="#0b1b2e" text-anchor="start">radios off, plans computed,</text>
<text x="712.0" y="494.0" font-size="12" font-weight="400" fill="#0b1b2e" text-anchor="start">waits for START, runs the program</text>
<rect x="420" y="598" width="550" height="130" rx="8" fill="#eaf2fc" stroke="#1560bd" stroke-width="1.6"/>
<path d="M420,628 v-22 a8,8 0 0 1 8,-8 h534 a8,8 0 0 1 8,8 v22 z" fill="#1560bd"/>
<text x="432.0" y="618.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Hiwonder RRC Lite (STM32F407)</text>
<text x="432.0" y="648.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">servo PWM port 3  ·  6-axis IMU at 50 Hz  ·  buzzer  ·  keys</text>
<text x="432.0" y="667.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">USB serial to the Pi 5 at 1,000,000 baud</text>
<text x="432.0" y="686.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">powers the Pi 5 over USB-C, 5 V 5 A</text>
<rect x="1090" y="126" width="280" height="128" rx="8" fill="#fff3e6" stroke="#d9730d" stroke-width="1.6"/>
<path d="M1090,156 v-22 a8,8 0 0 1 8,-8 h264 a8,8 0 0 1 8,8 v22 z" fill="#d9730d"/>
<text x="1102.0" y="146.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Steering servo</text>
<text x="1102.0" y="176.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">WLtoys micro servo, RRC port 3</text>
<text x="1102.0" y="195.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">1441 µs centre, 22.4 µs/deg</text>
<text x="1102.0" y="214.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">true lock 30° left / 22° right</text>
<rect x="1090" y="274" width="280" height="128" rx="8" fill="#fff3e6" stroke="#d9730d" stroke-width="1.6"/>
<path d="M1090,304 v-22 a8,8 0 0 1 8,-8 h264 a8,8 0 0 1 8,8 v22 z" fill="#d9730d"/>
<text x="1102.0" y="294.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Cytron MD13S driver</text>
<text x="1102.0" y="324.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">6–30 V, 13 A</text>
<text x="1102.0" y="343.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">PWM GPIO12 (490 Hz), DIR GPIO16</text>
<text x="1102.0" y="362.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">PWM low = brake</text>
<rect x="1090" y="422" width="280" height="124" rx="8" fill="#fff3e6" stroke="#d9730d" stroke-width="1.6"/>
<path d="M1090,452 v-22 a8,8 0 0 1 8,-8 h264 a8,8 0 0 1 8,8 v22 z" fill="#d9730d"/>
<text x="1102.0" y="442.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">130 motor and drivetrain</text>
<text x="1102.0" y="472.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">one brushed 130 motor</text>
<text x="1102.0" y="491.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">propshaft, front + rear differentials</text>
<text x="1102.0" y="510.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">4 wheels, 27 mm</text>
<rect x="1090" y="598" width="280" height="130" rx="8" fill="#fdeeee" stroke="#c0392b" stroke-width="1.6"/>
<path d="M1090,628 v-22 a8,8 0 0 1 8,-8 h264 a8,8 0 0 1 8,8 v22 z" fill="#c0392b"/>
<text x="1102.0" y="618.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Battery and POWER switch</text>
<text x="1102.0" y="648.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">7.4 V 2200 mAh Li-ion pack</text>
<text x="1102.0" y="667.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">16 mm latching POWER switch</text>
<text x="1102.0" y="686.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">feeds the RRC Lite and the MD13S</text>
<rect x="40" y="598" width="300" height="130" rx="8" fill="#f2f4f7" stroke="#6b7a8f" stroke-width="1.6"/>
<path d="M40,628 v-22 a8,8 0 0 1 8,-8 h284 a8,8 0 0 1 8,8 v22 z" fill="#6b7a8f"/>
<text x="52.0" y="618.5" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start">Laptop (development only)</text>
<text x="52.0" y="648.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">deploy, run, pull logs: tools/bw.py</text>
<text x="52.0" y="667.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">simulator: tools/sim_run.py</text>
<text x="52.0" y="686.0" font-size="13" font-weight="400" fill="#0b1b2e" text-anchor="start">not connected in race mode</text>
