<text x="40.0" y="790.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">Race mode (race/race_main.py) blocks the radios before a run (rule 11.10) and starts on the START button. The 2026-10-01 practice runs were started from the laptop.</text>
<text x="40.0" y="812.0" font-size="13" font-weight="400" fill="#5a6b80" text-anchor="start">No wheel encoder on this car: speed comes from the lidar pose and a duty-to-speed line fitted on the mat (v = 5.276 × (duty − 0.1012) m/s).</text>
